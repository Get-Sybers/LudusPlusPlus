# source.yml: repo-level metadata read by `ludus source list` (ParseSourceManifest in
# ludus-api/source_schema.go). Only manifest_version is required; authors, homepage
# and license are inherited by every blueprint in this source.
manifest_version: 1
name: "LudusPlusPlus"
description: >-
  Get-Sybers Packer templates for Ludus (Debian, AppX-sysprep-fixed Windows, Exchange 2019,
  FLARE VM, Metasploitable 2/3, OpenCore macOS), the get_sybers.templates build collection,
  the get_sybers.range_homevelo_agent role (the Home-Velo Velociraptor agent for range VMs),
  and CI that enforces the native Ludus template and source conventions.
authors:
  - "Get-Sybers"
homepage: https://github.com/Get-Sybers/LudusPlusPlus
# license: <SPDX identifier>   # set once a LICENSE file is added to the repository
