---
# Linux. Mirrors the server's install.sh (CA into the system store, binary into
# /usr/local/bin) but runs the agent on the merged config, which carries the CA
# itself, and installs the service under this role's own names so digger's
# velociraptor_client unit and binary are left alone.

- name: Linux | Trust the Proxmox CA (ca-certificates)
  ansible.builtin.copy:
    src: "{{ __hv_cache_dir }}/{{ __hv_ca_file }}"
    dest: /usr/local/share/ca-certificates/pve-root-ca.crt
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Refresh the system CA bundle

- name: Linux | Install the agent binary
  ansible.builtin.copy:
    src: "{{ __hv_cache_dir }}/{{ __hv_artifact }}"
    dest: "{{ range_homevelo_agent_linux_bin }}"
    owner: root
    group: root
    mode: "0755"
  become: true
  notify: Restart the Home-Velo Linux agent

- name: Linux | Write the client config (published config + Proxmox CA as a trusted root)
  ansible.builtin.copy:
    src: "{{ __hv_merged_config }}"
    dest: "{{ range_homevelo_agent_linux_config }}"
    owner: root
    group: root
    mode: "0600"
  become: true
  notify: Restart the Home-Velo Linux agent

- name: Linux | Write the systemd unit
  ansible.builtin.template:
    src: velociraptor-homevelo.service.j2
    dest: "/etc/systemd/system/{{ range_homevelo_agent_linux_service }}.service"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart the Home-Velo Linux agent

- name: Linux | Enable and start the agent
  ansible.builtin.systemd:
    name: "{{ range_homevelo_agent_linux_service }}"
    daemon_reload: true
    enabled: true
    state: started
  become: true

- name: Linux | Apply any pending restart now
  ansible.builtin.meta: flush_handlers
