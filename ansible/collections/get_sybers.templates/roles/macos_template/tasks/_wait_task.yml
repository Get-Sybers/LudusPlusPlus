---
- name: "Wait for Proxmox task to finish ({{ wt_upid }})"
  ansible.builtin.uri:
    url: "{{ macos_api_host }}/api2/json/nodes/{{ wt_node }}/tasks/{{ wt_upid }}/status"
    method: GET
    headers: "{{ macos_auth_headers }}"
    validate_certs: "{{ macos_validate_certs }}"
  register: wt_status
  until: wt_status.json.data.status == "stopped"
  retries: "{{ [1, (macos_task_timeout | int) // 5] | max }}"
  delay: 5
  no_log: true
- name: "Assert Proxmox task succeeded ({{ wt_upid }})"
  ansible.builtin.assert:
    that: wt_status.json.data.exitstatus == "OK"
    fail_msg: "Proxmox task {{ wt_upid }} failed: {{ wt_status.json.data.exitstatus | default('unknown') }}"
    quiet: true
