name: ludus-reference-drift

# The linter and the Packer smoke test enforce facts copied from the Ludus
# repositories into ludus-reference/ (variables Ludus injects, plugin versions,
# credentials, template names, the range-config schema). This workflow re-derives
# them from upstream main every week and opens an issue when they changed, so the
# rules never silently fall behind what the Ludus server actually does.

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Compare ludus-reference/ with upstream Ludus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install tooling
        run: python -m pip install --quiet -r requirements-ci.txt

      - name: Re-derive the reference data from upstream main
        id: check
        run: |
          set +e
          python scripts/update_ludus_reference.py --check | tee drift.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "status=${status}" >> "$GITHUB_OUTPUT"

      - name: Open or update a tracking issue
        if: steps.check.outputs.status != '0' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Ludus reference drift: upstream changed something the CI rules depend on"
          {
            echo "The weekly \`ludus-reference-drift\` run found that upstream Ludus (\`main\`)"
            echo "no longer matches \`ludus-reference/\`."
            echo
            echo "Run \`make update-reference\`, review whether a linter rule in"
            echo "\`scripts/ludus_source_lint.py\` or the smoke test needs to change, and commit"
            echo "the regenerated files."
            echo
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```diff'
            head -c 60000 drift.txt
            echo '```'
          } > body.md
          existing="$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number')"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body-file body.md
          else
            gh issue create --title "${title}" --body-file body.md
          fi

      - name: Fail on drift
        if: steps.check.outputs.status != '0'
        run: |
          echo "::error::ludus-reference/ drifted from upstream Ludus; see the diff above and run make update-reference"
          exit 1
