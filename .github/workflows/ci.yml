name: ci

# Holds every artifact in this Ludus source to the conventions the Ludus server
# itself relies on. See README.md#continuous-integration for what each job proves.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing at the workflow level, read-only checkouts per job, and no
# persisted git credentials in the checkout.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  source-structure:
    name: Ludus source structure, templates and blueprints
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout (with submodules, as `ludus source add` clones)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install tooling
        run: python -m pip install --quiet -r requirements-ci.txt

      - name: Lint the source against the Ludus conventions
        run: python scripts/ludus_source_lint.py --root . --format github

      - name: Linter self-tests
        run: python -m pytest -q tests

      - name: ludus-reference/ matches the upstream commits it records
        # Re-derive from the exact commits versions.json records as provenance (not
        # main), so a hand-edited or stale reference fails here; upstream Ludus
        # advancing is the weekly ludus-reference-drift job's signal, not a PR gate.
        run: |
          ludus_ref="$(python -c "import json; print(json.load(open('ludus-reference/versions.json'))['provenance']['ludus']['commit'])")"
          bsl_ref="$(python -c "import json; print(json.load(open('ludus-reference/versions.json'))['provenance']['ludus_source_bsl']['commit'])")"
          python scripts/update_ludus_reference.py --check --ref "$ludus_ref" --bsl-ref "$bsl_ref"

  packer:
    name: Packer fmt + validate with the Ludus plugin set
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Packer and plugins at the versions the Ludus server pins
        env:
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
        run: scripts/install_ludus_packer.sh

      - name: packer fmt -check and packer validate, invoked as `ludus templates build` does
        run: scripts/packer_smoke.sh --inspect

  ansible-and-yaml:
    name: yamllint + ansible-lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install tooling
        run: python -m pip install --quiet -r requirements-ci.txt

      - name: yamllint
        run: yamllint --format github .

      - name: Install the collections the Ludus server ships and this source's collections
        run: scripts/install_ansible_deps.sh

      - name: ansible-lint
        run: ansible-lint --offline

  shell-and-workflows:
    name: shellcheck + actionlint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck -S style scripts/*.sh

      - name: actionlint
        run: docker run --rm -v "${{ github.workspace }}:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  all-green:
    # The single status check to require on main: green only when every job above is.
    name: all-green
    if: ${{ always() }}
    needs: [source-structure, packer, ansible-and-yaml, shell-and-workflows]
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled" or . == "skipped")' <<<"$RESULTS" >/dev/null; then
            echo "::error::a required job failed, was cancelled or was skipped"
            exit 1
          fi
